<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="teal"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اقیانوس | دنیای کشتی‌ها</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{--pri:#0B3D3B;--acc:#14B8A6;--sec:#99F6E4;--sur:#E6FFFB;--bg:#F8FFFE;--tx:#0B3D3B;--mut:#3f6f6c;--glass:rgba(255,255,255,.45);--gb:rgba(255,255,255,.7);--sh:rgba(11,61,59,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="blue"]{--pri:#0B1F3B;--acc:#2563EB;--sec:#60A5FA;--sur:#DBEAFE;--bg:#F0F7FF;--tx:#0B1F3B;--mut:#46618a;--sh:rgba(11,31,59,.2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="x"]){--bg:var(--pri);--tx:var(--sur);--mut:var(--sec);--glass:rgba(255,255,255,.07);--gb:rgba(255,255,255,.16);--sh:rgba(0,0,0,.45)}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;overflow-x:hidden;scroll-padding-top:96px}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9;overflow-x:clip;min-height:100%;position:relative}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(90px);opacity:.55}
body::before{width:60vmax;height:60vmax;background:var(--sec);top:-20vmax;left:-15vmax}
body::after{width:55vmax;height:55vmax;background:var(--acc);bottom:-25vmax;right:-15vmax;opacity:.4}
.glass{background:var(--glass);border:1px solid var(--gb);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:0 12px 40px var(--sh),inset 0 1px 0 var(--gb)}
header{position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:20;margin:10px auto 0;width:min(1100px,calc(100% - 20px));border-radius:999px;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px}
.logo{font-weight:800;font-size:1.15rem;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo i{font-style:normal;background:var(--acc);color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
nav{display:flex;gap:2px;margin-inline-start:auto}
nav button,.ic{background:none;border:0;color:var(--tx);font:inherit;font-size:.88rem;padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.25s}
nav button:hover,.ic:hover{background:var(--gb)}
.ic{border:1px solid var(--gb);padding:5px 12px;font-size:1.05rem}
.burger{display:none}
@media(max-width:780px){nav{display:none}.burger{display:block;margin-inline-start:auto}}
#drawer{position:fixed;inset:0 0 0 auto;width:min(320px,86vw);z-index:30;transform:translateX(105%);visibility:hidden;transition:transform .45s cubic-bezier(.7,0,.2,1),visibility .45s;padding:70px 20px 20px;border-radius:28px 0 0 28px;background:var(--bg);overflow:auto}
#drawer.o{transform:none;visibility:visible}
#drawer h3{margin:10px 0 6px;color:var(--acc)}
#drawer a{display:block;padding:10px 14px;margin:6px 0;border-radius:16px;color:var(--tx);text-decoration:none;background:var(--glass);border:1px solid var(--gb)}
#x{position:absolute;top:18px;inset-inline-start:18px;background:none;border:0;color:var(--tx);font-size:1.5rem;cursor:pointer}
#shade{position:fixed;inset:0;background:#0007;z-index:25;opacity:0;pointer-events:none;transition:.3s}#shade.o{opacity:1;pointer-events:auto}
section{padding:64px 18px;max-width:1100px;margin:auto}
h2{font-size:clamp(1.6rem,5vw,2.3rem);font-weight:800}h2 span{color:var(--acc)}
.sub{color:var(--mut);margin-bottom:26px}
:root{--on:#0B3D3B}:root[data-theme="blue"]{--on:#fff}
.band{position:relative;background:var(--bb);color:var(--tx);box-shadow:0 0 0 100vmax var(--bb);clip-path:inset(0 -100vmax)}
.b-sur{--bb:var(--sur);--tx:var(--pri);--mut:color-mix(in srgb,var(--pri) 72%,var(--sur));--glass:rgba(255,255,255,.55);--gb:rgba(255,255,255,.95);--sh:rgba(11,31,59,.14);--ad:color-mix(in srgb,var(--acc) 62%,var(--pri))}
.b-sec{--bb:var(--sec);--tx:var(--pri);--mut:color-mix(in srgb,var(--pri) 80%,var(--sec));--glass:rgba(255,255,255,.4);--gb:rgba(255,255,255,.75);--sh:rgba(11,31,59,.18);--ad:color-mix(in srgb,var(--acc) 40%,var(--pri))}
.b-pri{--bb:var(--pri);--tx:var(--sur);--mut:var(--sec);--glass:rgba(255,255,255,.07);--gb:rgba(255,255,255,.18);--sh:rgba(0,0,0,.45);--ad:var(--sec)}
.b-acc{--bb:var(--acc);--tx:var(--on);--mut:var(--on);--glass:rgba(255,255,255,.22);--gb:rgba(255,255,255,.45);--sh:rgba(0,0,0,.2);--ad:var(--on)}
.band h2 span,.band .n,.band .price{color:var(--ad)}
.band .mt b:nth-child(3n){color:var(--tx)}
.hero{min-height:74vh;display:grid;place-items:center;text-align:center}
.hero .box{border-radius:40px;padding:48px 26px;max-width:760px}
.hero h1{font-size:clamp(2.1rem,8vw,4.2rem);font-weight:800;line-height:1.3}
.hero h1 span{color:var(--acc)}
.hero p{color:var(--mut);max-width:520px;margin:14px auto 26px}
.btn{display:inline-block;background:var(--acc);color:#fff;border:0;font:inherit;font-weight:800;padding:11px 26px;border-radius:999px;cursor:pointer;box-shadow:0 10px 26px var(--sh);transition:.3s}
.btn:hover{transform:translateY(-3px)}
.btn.g{background:var(--glass);color:var(--tx);border:1px solid var(--gb);margin-inline-start:8px}
.slider{position:relative;border-radius:32px;overflow:hidden}
.slide{display:none;padding:26px 18px 64px;text-align:center;animation:fi .7s}.slide.a{display:block}
@keyframes fi{from{opacity:0;transform:scale(.97)}}
.ph{width:100%;max-width:560px;aspect-ratio:16/9;margin:0 auto 14px;border-radius:24px;overflow:hidden;background:linear-gradient(var(--sur),var(--sec));display:grid;place-items:center;border:1px solid var(--gb)}
.ph img{width:100%;height:100%;object-fit:cover}.ph svg{width:92%}
.slide h3{font-size:1.5rem;color:var(--acc)}.slide p{color:var(--mut);max-width:520px;margin:auto}
.dots{position:absolute;bottom:18px;width:100%;display:flex;justify-content:center;gap:8px}
.dots i{width:9px;height:9px;border-radius:9px;background:var(--mut);opacity:.4;cursor:pointer;transition:.3s}.dots i.a{width:28px;background:var(--acc);opacity:1}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--gb);border-radius:12px;padding:0 10px;color:var(--mut);margin:4px 0}
.marq{overflow:hidden;border-radius:999px;padding:16px 0;direction:ltr;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mt{display:flex;gap:46px;width:max-content;animation:mq 28s linear infinite}.marq:hover .mt{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mt b{font-size:1.35rem;letter-spacing:2px;color:var(--mut);white-space:nowrap}.mt b:nth-child(3n){color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{border-radius:26px;padding:14px 14px 20px;transition:transform .2s,box-shadow .3s}
.card:hover{transform:translateY(-6px)}
.card .ph{border-radius:18px;margin-bottom:10px;max-width:none}
.card h4{font-size:1.08rem}.card p{color:var(--mut);font-size:.9rem}
.card .n{font-size:2rem;font-weight:800;color:var(--acc)}
.price{color:var(--acc);font-weight:800;font-size:1.1rem;margin:6px 0 10px}
.back{background:var(--glass);border:1px solid var(--gb);color:var(--tx);padding:8px 18px;border-radius:999px;font:inherit;cursor:pointer;margin-bottom:20px}
.note{color:var(--mut);font-size:.8rem;margin-top:24px}
footer{width:min(1100px,calc(100% - 20px));margin:40px auto 14px;border-radius:32px;padding:34px 24px 18px}
footer.glass{--tx:var(--sur);--mut:var(--sec);--gb:rgba(255,255,255,.18);background:var(--pri);color:var(--tx)}
footer.glass h5{color:var(--acc)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:24px}
footer h5{color:var(--acc);margin-bottom:6px;font-size:1rem}
footer a{display:block;color:var(--mut);text-decoration:none;font-size:.9rem;cursor:pointer;padding:2px 0}footer a:hover{color:var(--acc)}
footer p{color:var(--mut);font-size:.9rem}
.cp{text-align:center;color:var(--mut);font-size:.8rem;margin-top:22px;padding-top:14px;border-top:1px solid var(--gb)}
</style></head><body>
<header class="glass"><div class="logo" onclick="go('')"><i>⚓</i>اقیانوس</div>
<nav><button data-s="slider">تایتانیک</button><button data-s="brands">کشتی‌سازان</button><button data-s="tips">نکات ساخت</button><button data-s="types">انواع کشتی</button></nav>
<button class="ic" id="th" title="تغییر تم">🎨</button><button class="ic burger" id="bg" aria-label="منو">☰</button></header>
<div id="shade"></div>
<aside id="drawer" class="glass"><button id="x">✕</button><h3>بخش‌ها</h3><div id="ds"></div><h3>انواع کشتی</h3><div id="dl"></div></aside>
<main id="app"></main>
<footer class="glass"><div class="fg">
<div><h5>⚓ اقیانوس</h5><p>روایت غول‌های دریا، از تایتانیک تا ناوگان امروز؛ با قیمت و راهنمای ساخت.</p></div>
<div><h5>بخش‌ها</h5><a onclick="sc('slider')">تایتانیک و رقبا</a><a onclick="sc('brands')">کشتی‌سازان</a><a onclick="sc('tips')">نکات ساخت</a></div>
<div><h5>انواع کشتی</h5><div id="fl"></div></div>
<div><h5>تم</h5><a onclick="setT('teal')">🌊 فیروزه‌ای</a><a onclick="setT('blue')">🔷 آبی اقیانوسی</a></div></div>
<div class="cp">© ۲۰۲۶ اقیانوس · ساخته‌شده با عشق به دریا</div></footer>
<script>
const $=s=>document.querySelector(s);
/* عکس واقعی: آدرس عکس را اینجا بگذارید (یا data:URI). تا آن موقع، تصویر برداری نمایش داده می‌شود. */
const IMG={titanic:'',olympic:'',britannic:'',lusitania:'',mauretania:'',cruise:'',cargo:'',tanker:'',yacht:'',fish:'',boat:''};
function ship(k,c='#14B8A6'){const h=`<path d="M10 78 L290 78 L262 104 L38 104Z" fill="#0B3D3B" stroke="${c}" stroke-width="2"/><rect x="10" y="74" width="280" height="5" fill="${c}"/>`;
const w=`<path d="M0 108 q15 -9 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="#60A5FA" stroke-width="3" opacity=".7"/>`;
let s='';
if(k=='cruise')s=`<rect x="40" y="52" width="220" height="24" rx="4" fill="#eaf0fa"/><rect x="70" y="32" width="150" height="22" rx="4" fill="#d5deef"/><rect x="100" y="16" width="80" height="18" rx="4" fill="#eaf0fa"/><rect x="215" y="18" width="14" height="22" fill="${c}"/>`+[...Array(12)].map((_,i)=>`<rect x="${50+i*17}" y="58" width="8" height="6" fill="#2b4a82"/>`).join('');
else if(k=='cargo')s=[...Array(5)].map((_,i)=>[...Array(3)].map((_,j)=>`<rect x="${30+i*36}" y="${58-j*14}" width="33" height="13" fill="${['#c0392b','#2c7be5','#e8a33d','#2fa36b'][(i+j*2)%4]}"/>`).join('')).join('')+`<rect x="225" y="26" width="40" height="50" fill="#eaf0fa"/><rect x="232" y="32" width="26" height="8" fill="#2b4a82"/>`;
else if(k=='tanker')s=`<rect x="25" y="64" width="190" height="14" fill="#b83a3a"/><path d="M50 64v-8M100 64v-8M150 64v-8M200 64v-8" stroke="#aaa" stroke-width="3"/><rect x="228" y="30" width="34" height="46" fill="#eaf0fa"/><rect x="236" y="36" width="18" height="7" fill="#2b4a82"/>`;
else if(k=='yacht')s=`<path d="M40 78 L70 56 L230 56 L262 78Z" fill="#fff"/><rect x="95" y="38" width="100" height="19" rx="5" fill="#dfe8f6"/><rect x="120" y="22" width="48" height="17" rx="4" fill="#fff"/><path d="M144 22V6" stroke="${c}" stroke-width="3"/>`;
else if(k=='fish')s=`<rect x="170" y="40" width="50" height="38" fill="#eaf0fa"/><rect x="178" y="46" width="34" height="9" fill="#2b4a82"/><path d="M60 78V30L140 60" stroke="#ccc" stroke-width="3" fill="none"/><path d="M60 30L30 70" stroke="#ccc" stroke-width="2"/>`;
else if(k=='boat')s=`<path d="M60 78 L90 62 L200 62 L240 78Z" fill="#fff"/><path d="M110 62 L130 44 L170 44 L180 62Z" fill="#9fc4f5"/>`;
else s=`<rect x="30" y="56" width="240" height="20" rx="3" fill="#1a1a1a"/><rect x="50" y="42" width="190" height="15" fill="#eaf0fa"/><path d="M80 42V16M122 42V10M164 42V16M206 42V10" stroke="#d9a441" stroke-width="12"/>`;
return `<svg viewBox="0 0 300 120">${w}${s}${h}</svg>`}
const pic=(id,c)=>`<div class="ph">${IMG[id]?`<img src="${IMG[id]}" alt="" loading="lazy">`:ship(id,c)}</div>`;
const T=[
{id:'cruise',e:'🛳️',n:'کشتی کروز',d:'شهرهای شناور برای هزاران مسافر.',m:[['کلاس آیکون (۵۶۰۰ مسافر)','حدود ۲ میلیارد دلار'],['کلاس ویندجمر/متوسط','حدود ۸۰۰ تا ۱٬۲۰۰ میلیون دلار'],['کشتی اکتشافی کوچک','حدود ۱۵۰ تا ۳۰۰ میلیون دلار']]},
{id:'cargo',e:'📦',n:'کانتینربر',d:'ستون فقرات تجارت جهانی.',m:[['۲۴٬۰۰۰ TEU','حدود ۲۲۰ تا ۲۶۰ میلیون دلار'],['۱۵٬۰۰۰ TEU','حدود ۱۴۰ تا ۱۷۰ میلیون دلار'],['فیدر ۲٬۵۰۰ TEU','حدود ۳۵ تا ۵۰ میلیون دلار']]},
{id:'tanker',e:'🛢️',n:'نفتکش',d:'غول‌های حمل نفت خام و فرآورده.',m:[['VLCC (۳۰۰٬۰۰۰ تن)','حدود ۱۲۰ تا ۱۳۵ میلیون دلار'],['سوئزمکس','حدود ۸۰ تا ۹۰ میلیون دلار'],['آفرامکس','حدود ۶۵ تا ۷۵ میلیون دلار']]},
{id:'yacht',e:'⛵',n:'یات لوکس',d:'اوج تجمل روی آب.',m:[['سوپریات ۱۰۰ متری','حدود ۲۰۰ تا ۳۰۰ میلیون دلار'],['یات ۵۰ متری','حدود ۳۰ تا ۴۵ میلیون دلار'],['یات ۲۵ متری','حدود ۵ تا ۱۰ میلیون دلار']]},
{id:'fish',e:'🎣',n:'کشتی ماهیگیری',d:'کار سخت دریا، با بدنه‌ای مقاوم.',m:[['ترالر ۳۰ متری','حدود ۳ تا ۶ میلیون دلار'],['لنج ۱۸ متری','حدود ۸۰۰ هزار تا ۱.۵ میلیون دلار'],['قایق ۱۲ متری','حدود ۲۵۰ تا ۵۰۰ هزار دلار']]},
{id:'boat',e:'🚤',n:'قایق تفریحی',d:'برای آخر هفته‌های بی‌نظیر.',m:[['کروزر ۱۲ متری','حدود ۴۰۰ تا ۹۰۰ هزار دلار'],['اسپیدبوت ۹ متری','حدود ۱۰۰ تا ۲۵۰ هزار دلار'],['قایق ۶ متری','حدود ۲۰ تا ۶۰ هزار دلار']]}];
const S=[['titanic','تایتانیک','۱۹۱۲ · ۲۶۹ متر · هارلند و ولف','نماد غم‌انگیزترین سفر تاریخ؛ در نخستین سفرش پس از برخورد با کوه یخ غرق شد.'],
['olympic','المپیک','۱۹۱۱ · خواهر ارشد تایتانیک','تقریباً هم‌شکل تایتانیک و با عمری موفق، بیش از ۲۴ سال خدمت کرد.'],
['britannic','بریتانیک','۱۹۱۴ · کشتی بیمارستانی','سومین خواهر؛ با طراحی ایمن‌تر ساخته شد ولی در جنگ جهانی اول بر اثر مین غرق شد.'],
['lusitania','لوسیتانیا','۱۹۰۷ · کانارد','ملکه سرعت اقیانوس اطلس، تا اینکه در ۱۹۱۵ با اژدر غرق شد.'],
['mauretania','موریتانیا','۱۹۰۷ · کانارد','بیش از ۲۰ سال نوار آبی اطلس را نگه داشت؛ رقیب اصلی تایتانیک.']];
const B=['HARLAND & WOLFF','FINCANTIERI','MEYER WERFT','HYUNDAI HEAVY','CHANTIERS DE L’ATLANTIQUE','DAMEN','BENETTI','LÜRSSEN','SAMSUNG HEAVY','DSME'];
const TIPS=[['طراحی بدنه','نسبت طول به عرض و شکل دماغه، مصرف سوخت و پایداری را تعیین می‌کند.'],['شناوری و پایداری','مرکز ثقل باید همیشه پایین‌تر از مرکز شناوری موثر بماند تا کشتی واژگون نشود.'],['فولاد و جوشکاری','فولاد دریایی ضدخستگی و جوش بی‌نقص، عمر ۳۰ ساله کشتی را رقم می‌زند.'],['حفاظت از زنگ‌زدگی','رنگ‌های ضدخوردگی و آندهای قربانی از بدنه در برابر آب شور محافظت می‌کنند.'],['ماشین‌آلات و سوخت','انتخاب موتور و پروانه، قلب بهره‌وری و رعایت قوانین آلایندگی است.'],['ایمنی و استانداردها','رعایت قوانین IMO، آب‌بندی و قایق نجات برای هر کشتی الزامی است.']];
function home(){return `<section class="hero"><div class="box glass"><h1>دریا را<br><span>باشکوه</span> ببین</h1><p>داستان غول‌های اقیانوس، از تایتانیک تا مدرن‌ترین ناوگان جهان؛ و اینکه چطور یکی را مال خودت کنی.</p><button class="btn" onclick="sc('types')">انواع کشتی‌ها</button><button class="btn g" onclick="sc('slider')">داستان تایتانیک</button></div></section>
<section id="slider" class="band b-sur"><h2>تایتانیک و <span>رقبایش</span></h2><p class="sub">پنج کشتی که عصر طلایی اقیانوس‌پیماها را ساختند.</p>
<div class="slider glass">${S.map((s,i)=>`<div class="slide${i?'':' a'}">${pic(s[0],['#14B8A6','#60A5FA','#c0392b','#2fa36b','#b07ad8'][i])}<h3>${s[1]}</h3><span class="tag">${s[2]}</span><p>${s[3]}</p></div>`).join('')}<div class="dots">${S.map((_,i)=>`<i class="${i?'':'a'}" data-i="${i}"></i>`).join('')}</div></div></section>
<section id="brands" class="band b-acc"><h2>بزرگ‌ترین <span>کشتی‌سازان</span> جهان</h2><p class="sub">نام‌هایی که دریا را ساخته‌اند.</p><div class="marq glass"><div class="mt">${[...B,...B].map(b=>`<b>${b}</b>`).join('')}</div></div></section>
<section id="tips" class="band b-pri"><h2>نکات <span>کشتی‌سازی</span></h2><p class="sub">شش اصلی که هر کشتی خوب روی آن بنا می‌شود.</p><div class="grid">${TIPS.map((t,i)=>`<div class="card glass" style="padding:22px"><div class="n">0${i+1}</div><h4>${t[0]}</h4><p>${t[1]}</p></div>`).join('')}</div></section>
<section id="types" class="band b-sec"><h2>انواع <span>کشتی‌ها</span></h2><p class="sub">یکی را انتخاب کن تا مدل‌های قابل خرید را ببینی.</p><div class="grid">${T.map(t=>`<div class="card glass" onclick="go('${t.id}')" style="cursor:pointer">${pic(t.id)}<h4>${t.e} ${t.n}</h4><p>${t.d}</p></div>`).join('')}</div></section>`}
function page(t){return `<section class="band b-sur"><button class="back" onclick="go('')">→ بازگشت</button><h2>${t.e} <span>${t.n}</span></h2><p class="sub">${t.d}</p><div class="grid">${t.m.map(m=>`<div class="card glass">${pic(t.id)}<h4>${m[0]}</h4><div class="price">${m[1]}</div><button class="btn" style="padding:8px 20px;font-size:.85rem">استعلام خرید</button></div>`).join('')}</div><p class="note">قیمت‌ها تقریبی و بر پایه بازار ساخت جدید است و بسته به سازنده، مشخصات و زمان تحویل تغییر می‌کند. پیش از هر خرید، با کارگزار رسمی تأیید شود.</p></section>`}
let tm;
function render(){const id=location.hash.slice(1),t=T.find(x=>x.id==id);$('#app').innerHTML=t?page(t):home();scrollTo(0,0);clearInterval(tm);if(!t)slider()}
function go(h){if(location.hash.slice(1)==h)render();else location.hash=h}
function sc(id){const e=document.getElementById(id);closeD();e?e.scrollIntoView({behavior:'smooth'}):(location.hash='',setTimeout(()=>sc(id),80))}
function slider(){let i=0;const sl=[...document.querySelectorAll('.slide')],d=[...document.querySelectorAll('.dots i')];const show=n=>{i=n;sl.forEach((s,k)=>s.classList.toggle('a',k==n));d.forEach((s,k)=>s.classList.toggle('a',k==n))};d.forEach(x=>x.onclick=()=>show(+x.dataset.i));tm=setInterval(()=>show((i+1)%sl.length),4500)}
const dr=$('#drawer'),sh=$('#shade');function closeD(){dr.classList.remove('o');sh.classList.remove('o')}
function setT(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}}
try{const t=localStorage.getItem('th');if(t)setT(t)}catch(e){}
$('#th').onclick=()=>setT(document.documentElement.dataset.theme=='teal'?'blue':'teal');
const L=T.map(t=>`<a href="#${t.id}" onclick="closeD()">${t.e} ${t.n}</a>`).join('');$('#dl').innerHTML=L;$('#fl').innerHTML=L;
$('#ds').innerHTML=[['slider','🚢 تایتانیک و رقبا'],['brands','🏭 کشتی‌سازان'],['tips','🔧 نکات ساخت']].map(s=>`<a href="javascript:void 0" onclick="sc('${s[0]}')">${s[1]}</a>`).join('');
$('#bg').onclick=()=>{dr.classList.add('o');sh.classList.add('o')};$('#x').onclick=sh.onclick=closeD;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>sc(b.dataset.s));
addEventListener('hashchange',render);render();
</script></body></html>
